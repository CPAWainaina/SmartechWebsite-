<text x="60" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0d1b2a">Commercial / Industrial Hybrid Power</text>
<text x="60" y="92" font-family="Arial,sans-serif" font-size="18" fill="#4b6070">Solar, battery storage and backup sources can be coordinated around the site's load.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="60" y="190" width="170" height="110" rx="16" fill="#dceeff" stroke="#1a73b8" stroke-width="3"/><text x="145" y="235" font-size="21" font-weight="700" fill="#0d1b2a">Solar PV</text><text x="145" y="267" font-size="16" fill="#425466">Generation</text>
